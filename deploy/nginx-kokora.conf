# Installation sans Docker : /etc/nginx/sites-available/kokora (certificat : sudo certbot --nginx -d votre-domaine)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name kokora.example.sn;
    client_max_body_size 12m;  # envoi de photos (8 Mo par image)

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        # Temps réel (SignalR / WebSockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
